<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>超级打印</title>
  <link rel="stylesheet" href="./css/theme.css?v=20261006-09">
  <link rel="stylesheet" href="./css/sidebar.css?v=20261006-09">
  <link rel="stylesheet" href="./css/print.css?v=20261006-09" media="print">
</head>
<body class="aurora-app">
  <div class="aurora-layer" aria-hidden="true"></div>

  <main class="quick-shell">
    <header class="quick-header glass-card">
      <div class="quick-brand">
        <div class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></div>
        <div><h1>超级打印</h1><p>快速打印 <span id="buildVersionBadge" class="build-version-badge build-version-inline">v20261006-09</span></p></div>
      </div>
      <div class="quick-header-actions">
        <button id="accountBtn" class="header-icon account-entry" title="账户与私有模板"><span id="accountBadge">账号</span></button>
        <button id="openDesigner" class="header-icon" title="编辑或自定义当前模板">✎</button>
        <button id="moreBtn" class="header-icon" title="更多">···</button>
        <span id="sdkState" class="status-pill">连接中</span>
      </div>
    </header>

    <section class="quick-meta glass-card">
      <div class="meta-row">
        <span class="meta-label">记录</span>
        <button id="recordChooser" class="meta-value">
          <strong id="recordTitle">未选择记录</strong>
          <small id="recordSub">点击选择</small>
        </button>
      </div>
      <div class="meta-row">
        <span class="meta-label">模板</span>
        <button id="templateChooser" class="meta-value">
          <strong id="currentTemplateName">未选择模板</strong>
          <small>切换模板</small>
        </button>
      </div>
    </section>

    <section class="preview-card glass-card">
      <div class="preview-head">
        <div><span class="mini-bars"><i></i><i></i><i></i></span><b>打印预览</b><span id="issueBar" class="preview-health ok"><i>●</i><b id="issueText">数据正常</b></span></div>
        <button id="zoomPreviewBtn" class="preview-action">弹出预览 ↗</button>
      </div>
      <div id="previewViewport" class="preview-viewport">
        <div class="preview-float-tools" aria-label="预览缩放工具">
          <button id="previewFitBtn" title="适配">适配</button>
          <button id="previewResetBtn" title="还原">还原</button>
          <button id="previewZoomOutBtn" title="缩小">−</button>
          <span id="previewZoomText">100%</span>
          <button id="previewZoomInBtn" title="放大">＋</button>
        </div>
        <div id="previewStage" class="preview-stage">
          <div id="previewEmpty" class="preview-empty">
            <b>选择记录后显示打印成品</b>
            <span>预览会按照当前模板真实渲染</span>
          </div>
          <div id="previewHost" class="preview-host"></div>
        </div>
      </div>
      <div class="preview-footer">
        <span id="previewCounter">1 / 1</span>
        <span id="previewHint">滚轮缩放 · 拖动画布 · 双击适配</span>
      </div>
    </section>

    <section class="print-dock glass-card">
      <button id="printCurrent" class="btn btn-primary print-main">打印当前记录</button>
      <div class="print-secondary">
        <button id="chooseBatch" class="mini-btn">选择多条</button>
        <button id="prevRecord" class="mini-btn">上一条</button>
        <button id="nextRecord" class="mini-btn">下一条</button>
      </div>
    </section>

    <footer class="quick-status">
      <span><i class="status-dot"></i><b id="statusText">准备就绪</b></span>
      <span id="selectionText">未选择记录</span>
    </footer>
  </main>

  <div id="moreMenu" class="more-menu hidden">
    <button id="refreshData">重新同步数据</button>
  </div>

  <div id="templateLibraryModal" class="template-library-modal hidden" role="dialog" aria-modal="true" aria-label="模板库">
    <section class="template-library-dialog glass-card">
      <div class="template-library-head">
        <div>
          <span class="mini-bars"><i></i><i></i><i></i></span>
          <b>模板库</b>
          <small id="templateLibraryCount">0 个模板</small>
          <small id="templateLibraryState" data-state="">本地</small>
        </div>
        <div class="template-library-head-actions">
          <button id="templateLibrarySync" type="button" title="同步自定义模板到云端">同步</button>
          <button id="templateLibraryClose" type="button" title="关闭模板库">×</button>
        </div>
      </div>
      <div class="template-scope-tabs" role="tablist" aria-label="模板范围">
        <button type="button" data-template-scope="mine" class="active">我的模板</button>
        <button type="button" data-template-scope="builtin">内置模板</button>
      </div>
      <div class="template-library-tools">
        <input id="templateLibrarySearch" type="search" placeholder="搜索模板、尺寸或用途" aria-label="搜索模板">
        <select id="templateCategoryFilter" aria-label="模板分类">
          <option value="全部">全部分类</option>
        </select>
      </div>
      <div id="templateLibraryList" class="template-library-list"></div>
      <div id="templateLibraryEmpty" class="template-library-empty hidden">没有匹配的模板</div>
      <div class="template-library-footer">
        <button id="importTemplate" type="button">导入模板</button>
        <button id="exportTemplate" type="button">导出当前模板</button>
        <button id="deleteTemplate" type="button" class="danger">删除当前模板</button>
      </div>
      <input id="importTemplateFile" type="file" accept="application/json,.json,.superprint.json" hidden>
    </section>
  </div>

  <div id="accountModal" class="account-modal hidden" role="dialog" aria-modal="true" aria-label="账户与私有模板">
    <section class="account-dialog glass-card">
      <div class="account-head">
        <div><b>账户与私有模板</b><small id="accountStateText">正在识别身份</small></div>
        <button id="accountClose" type="button" title="关闭">×</button>
      </div>
      <div class="account-summary">
        <div class="account-avatar" aria-hidden="true">私</div>
        <div><strong id="accountTitle">未登录</strong><small id="accountSub">登录后模板可跨设备同步</small></div>
      </div>
      <div class="account-provider-row">
        <span>飞书身份</span><b id="feishuIdentityState">未识别</b>
      </div>
      <div class="account-phone-box">
        <b>绑定手机号 / 独立登录</b>
        <small>手机号验证后，可在非飞书环境使用同一套私人模板。</small>
        <div class="account-phone-line">
          <input id="accountPhone" inputmode="tel" autocomplete="tel" placeholder="手机号，例如 13800138000">
          <button id="sendPhoneCode" type="button">获取验证码</button>
        </div>
        <div class="account-phone-line">
          <input id="accountCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6 位验证码">
          <button id="verifyPhoneCode" type="button" class="primary">验证并绑定</button>
        </div>
        <small id="phoneLoginHint"></small>
      </div>
      <div class="account-actions">
        <button id="accountSyncNow" type="button">立即同步我的模板</button>
        <button id="accountLogout" type="button">退出本机账号</button>
      </div>
    </section>
  </div>

  <div id="compatPanel" class="compat-panel hidden">
    <div class="compat-card glass-card">
      <div class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></div>
      <h2>超级打印暂时无法嵌入加载</h2>
      <p id="compatMessage">正在检查当前电脑的浏览器与飞书环境。</p>
      <div class="compat-actions">
        <button id="compatRetry" class="btn btn-primary">重新连接</button>
        <button id="compatOpen" class="btn btn-secondary">新窗口打开</button>
        <button id="compatCopy" class="btn btn-secondary">复制诊断信息</button>
      </div>
      <small id="compatDetails"></small>
    </div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./app.js?v=20261006-09"></script>
</body>
</html>
