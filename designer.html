<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>超级打印 · 模板设计器</title>
  <link rel="stylesheet" href="./css/theme.css?v=20261005-22">
  <link rel="stylesheet" href="./css/designer.css?v=20261005-22">
  <link rel="stylesheet" href="./css/print.css?v=20261005-22" media="print">
</head>
<body class="aurora-app designer-body">
  <div class="aurora-layer" aria-hidden="true"></div>
  <header class="designer-top glass">
    <div class="designer-brand" title="build 20261005-22"><span class="brand-mark"><i></i><i></i><i></i></span><div><b>超级打印</b><small>模板设计器 <span id="buildVersionBadge" class="build-version-badge build-version-inline">v20261005-22</span></small></div></div>
    <input id="templateName" class="template-name" value="未命名模板">
    <div class="top-tools">
      <button id="leftToggle" class="panel-toggle" title="收起/展开组件栏">☰</button><button id="rightToggle" class="panel-toggle" title="收起/展开属性栏">◫</button>
      <button id="undoBtn" title="撤销">↶</button><button id="redoBtn" title="重做">↷</button>
      <button id="quickBtn">快捷模式</button><button id="newBtn">新建</button><button id="saveBtn">保存</button><button id="previewBtn">实际预览</button>
      <button id="fullBtn">⛶ 全屏</button><button id="printBtn" class="primary">测试打印</button>
    </div>
  </header>

  <main id="designerGrid" class="designer-grid">
    <aside class="designer-left glass">
      <div class="tabs"><button class="tab active" data-tab="components">组件</button><button class="tab" data-tab="fields">数据</button></div>
      <section id="componentsTab" class="tab-body">
        <h3><span class="mini-bars"><i></i><i></i><i></i></span>基础组件</h3>
        <div class="component-palette">
          <button draggable="true" data-type="text"><b>T</b><span>文本</span></button>
          <button draggable="true" data-type="field"><b>{ }</b><span>数据字段</span></button>
          <button draggable="true" data-type="image"><b>▧</b><span>图片</span></button>
          <button draggable="true" data-type="table"><b>▦</b><span>明细表格</span></button>
          <button draggable="true" data-type="barcode"><b>|||</b><span>条码</span></button>
          <button draggable="true" data-type="qrcode"><b>▦</b><span>二维码</span></button>
          <button draggable="true" data-type="line"><b>—</b><span>分隔线</span></button>
          <button draggable="true" data-type="container"><b>□</b><span>容器</span></button>
        </div>
        <div class="section-sep"></div>
        <h3><span class="mini-bars"><i></i><i></i><i></i></span>页面</h3>
        <div class="page-form">
          <label>预设<select id="pagePreset"><option value="215x140">215×140</option><option value="210x297">A4</option><option value="148x210">A5</option><option value="100x150">100×150</option><option value="70x50">70×50</option><option value="custom">自定义</option></select></label>
          <div class="two"><label>宽<input id="pageW" type="number" step=".1"></label><label>高<input id="pageH" type="number" step=".1"></label></div>
          <label>安全区<input id="safeArea" type="number" step=".5" min="0"></label>
          <button id="applyPage" class="wide-btn">应用页面尺寸</button>
        </div>
      </section>
      <section id="fieldsTab" class="tab-body hidden">
        <h3><span class="mini-bars"><i></i><i></i><i></i></span>飞书字段</h3>
        <div class="data-sync-box"><span id="dataSyncState">等待飞书数据</span><div><button id="syncDataBtn" class="wide-btn">重新同步</button><button id="autoBindBtn" class="wide-btn">自动绑定</button></div></div><input id="fieldSearch" class="field-search" placeholder="搜索字段"><div id="fieldList" class="field-list"></div>
      </section>
    </aside>

    <section class="designer-center">
      <div class="canvas-toolbar glass">
        <div class="canvas-tools-left"><label><input id="gridToggle" type="checkbox" checked> 网格</label><label><input id="snapToggle" type="checkbox" checked> 吸附</label><label><input id="safeToggle" type="checkbox" checked> 安全区</label>
          <div id="multiTools" class="multi-tools hidden">
            <button data-multi="left" title="左对齐">左</button><button data-multi="hcenter" title="水平居中">中</button><button data-multi="right" title="右对齐">右</button>
            <button data-multi="top" title="顶部对齐">上</button><button data-multi="vcenter" title="垂直居中">中</button><button data-multi="bottom" title="底部对齐">下</button>
            <button data-multi="distributeH" title="水平等间距">横距</button><button data-multi="distributeV" title="垂直等间距">纵距</button>
          </div>
        </div>
        <div id="pageInfo">215 × 140 mm</div>
      </div>
      <div id="canvasScroller" class="canvas-scroller">
        <div id="zoomLayer" class="zoom-layer">
          <div id="topRuler" class="top-ruler"></div>
          <div class="canvas-row"><div id="leftRuler" class="left-ruler"></div><div class="page-pad">
            <div id="printPage" class="print-page grid-on">
              <div id="safeGuide" class="safe-guide"></div>
              <div id="guideX" class="guide guide-x hidden"></div>
              <div id="guideY" class="guide guide-y hidden"></div>
            </div>
          </div></div>
        </div>
      </div>
      <footer class="designer-status glass">
        <span id="saveState"><i></i>已加载</span><span id="selectionState">0 个元素</span>
        <div class="zoom-box"><button id="fitBtn" title="适配窗口">适配</button><button id="zoomOut">−</button><input id="zoomRange" type="range" min="25" max="180" step="5" value="75"><button id="zoomIn">＋</button><b id="zoomText">75%</b></div>
      </footer>
    </section>

    <aside class="designer-right glass">
      <div class="right-tabs"><button class="rtab active" data-rtab="props">属性</button><button class="rtab" data-rtab="layers">图层</button></div>
      <section id="propsTab" class="right-body">
        <div id="noSelection" class="no-selection">选择画布元素后可精确调整</div>
        <div id="props" class="hidden">
          <div class="section-title"><span class="mini-bars"><i></i><i></i><i></i></span>位置与尺寸</div>
          <div class="four-grid"><label>X<input id="propX" type="number" step=".1"></label><label>Y<input id="propY" type="number" step=".1"></label><label>W<input id="propW" type="number" step=".1"></label><label>H<input id="propH" type="number" step=".1"></label></div>
          <div class="section-sep"></div>
          <div class="section-title"><span class="mini-bars"><i></i><i></i><i></i></span>内容 <span id="elementTypeBadge" class="type-badge"></span></div>
          <div id="textProps" class="prop-group">
            <label class="stack">文本<textarea id="propText" rows="3"></textarea></label>
            <label class="stack">绑定字段<select id="propField"><option value="">未绑定</option></select></label>
            <div class="two"><label>字号<input id="propFontSize" type="number" min="6"></label><label>字重<select id="propWeight"><option value="400">常规</option><option value="500">中等</option><option value="600">半粗</option><option value="700">粗体</option><option value="800">特粗</option></select></label></div>
            <label class="stack">对齐<div class="segmented"><button data-align="left">左</button><button data-align="center">中</button><button data-align="right">右</button></div></label>
            <div class="two"><label>自动换行<select id="textWrap"><option value="true">开启</option><option value="false">关闭</option></select></label><label>最大行数<input id="textMaxLines" type="number" min="0" step="1" placeholder="0=不限"></label></div>
            <div class="two"><label>溢出<select id="textOverflow"><option value="clip">裁切</option><option value="ellipsis">省略</option><option value="grow">自动增高</option></select></label><label>空值<select id="textEmptyBehavior"><option value="hide">隐藏组件</option><option value="blank">留空</option><option value="placeholder">显示占位</option></select></label></div>
          </div>
          <div id="imageProps" class="prop-group hidden">
            <label class="stack">图片字段<select id="imageField"><option value="">未绑定</option></select></label>
            <div class="two"><label>适应<select id="imageFit"><option value="contain">完整显示</option><option value="cover">铺满裁切</option><option value="fill">拉伸填充</option><option value="original">原尺寸</option></select></label><label>圆角<input id="imageRadius" type="number" min="0" step="1"></label></div>
            <label class="stack">尺寸比例<select id="imageAspectLock"><option value="true">锁定原图比例</option><option value="false">自由拉伸</option></select></label>
            <div class="two"><label>水平<select id="imageAlignX"><option value="left">左</option><option value="center">中</option><option value="right">右</option></select></label><label>垂直<select id="imageAlignY"><option value="top">上</option><option value="center">中</option><option value="bottom">下</option></select></label></div>
            <div class="two"><label>内边距<input id="imagePadding" type="number" min="0" step=".5"></label><label>空值<select id="imageEmptyBehavior"><option value="hide">打印隐藏</option><option value="blank">留空</option><option value="placeholder">显示占位</option></select></label></div>
          </div>
          <div id="tableProps" class="prop-group hidden">
            <label class="stack">数据源<select id="tableDataField"><option value="">当前记录（单行）</option></select></label>
            <div class="stack"><span>列配置</span><div id="tableColumnList" class="table-column-list"></div></div>
            <div class="table-column-actions"><button id="addTableColumn" type="button">+ 添加列</button><button id="normalizeTableWidths" type="button">均分列宽</button></div>
            <div class="two"><label>表头<select id="tableHeader"><option value="true">显示</option><option value="false">隐藏</option></select></label><label>斑马纹<select id="tableZebra"><option value="false">关闭</option><option value="true">开启</option></select></label></div>
            <label class="stack">图片单元格<select id="tableImageFit"><option value="contain">完整显示</option><option value="cover">铺满裁切</option><option value="fill">拉伸填充</option><option value="original">原尺寸</option></select></label>
            <div class="two"><label>文字换行<select id="tableWrap"><option value="true">开启</option><option value="false">关闭</option></select></label><label>空列<select id="tableHideEmptyColumns"><option value="true">自动隐藏</option><option value="false">保留</option></select></label></div>
            <label class="stack">无数据<select id="tableEmptyBehavior"><option value="hide">打印隐藏空表</option><option value="blank">保留空表</option></select></label>
            <div class="two"><label>行高(mm)<input id="tableRowHeight" type="number" min="4" step=".5"></label><label>最多数据行<input id="tableMaxRows" type="number" min="1" step="1"></label></div>
            <div class="two"><label>边框<input id="tableBorderWidth" type="number" min="0" max="4" step=".5"></label><label>字号<input id="tableFontSize" type="number" min="6"></label></div>
            <div class="table-editor-hint">
              <b>单元格编辑</b>
              <span id="tableSelectionHint">单击或拖拽选择格子，操作工具会悬浮在表格上方</span>
            </div>
            <div id="tableCellInspector" class="table-cell-inspector hidden">
              <div class="section-title"><span class="mini-bars"><i></i><i></i><i></i></span>选中单元格</div>
              <label class="stack">内容类型<select id="tableCellType"><option value="inherit">跟随列</option><option value="field">绑定字段</option><option value="text">固定文本</option><option value="image">图片字段</option></select></label>
              <label id="tableCellFieldGroup" class="stack">字段<select id="tableCellField"><option value="">未绑定</option></select></label>
              <label id="tableCellTextGroup" class="stack">固定文本<input id="tableCellText" type="text" placeholder="输入固定内容"></label>
              <div id="tableCellValueState" class="table-cell-value-state hidden"></div>
              <div class="two"><label>水平<select id="tableCellAlign"><option value="">跟随列</option><option value="left">左</option><option value="center">中</option><option value="right">右</option></select></label><label>垂直<select id="tableCellVAlign"><option value="top">上</option><option value="middle">中</option><option value="bottom">下</option></select></label></div>
              <div class="two"><label>内边距<input id="tableCellPadding" type="number" min="0" step=".5" value="2"></label><label>换行<select id="tableCellWrap"><option value="true">开启</option><option value="false">关闭</option></select></label></div>
              <label id="tableCellImageFitGroup" class="stack">图片适配<select id="tableCellImageFit"><option value="cover">铺满裁切</option><option value="contain">完整显示</option><option value="fill">拉伸填充</option><option value="original">原尺寸</option></select></label>
            </div>
          </div>
          <div id="codeProps" class="prop-group hidden">
            <label class="stack">数据字段<select id="codeField"><option value="">未绑定</option></select></label>
            <div id="barcodeOnly" class="prop-group"><div class="two"><label>格式<select id="barcodeFormat"><option value="CODE128">CODE128</option><option value="CODE39">CODE39</option><option value="EAN13">EAN13</option></select></label><label>文字<select id="barcodeText"><option value="true">显示</option><option value="false">隐藏</option></select></label></div><label class="stack">条码文字大小<input id="barcodeFontSize" type="number" min="6" max="24" step="1"></label></div>
            <div id="qrOnly" class="two hidden"><label>纠错<select id="qrLevel"><option value="L">L</option><option value="M">M</option><option value="Q">Q</option><option value="H">H</option></select></label><label>边距<input id="qrMargin" type="number" min="0" max="8"></label></div>
          </div>
          <div id="shapeProps" class="prop-group hidden">
            <div class="two"><label>线宽<input id="shapeBorderWidth" type="number" min="0" max="6" step=".5"></label><label>圆角<input id="shapeRadius" type="number" min="0" step="1"></label></div>
            <label class="stack">线型<select id="shapeBorderStyle"><option value="solid">实线</option><option value="dashed">虚线</option><option value="dotted">点线</option></select></label>
          </div>
          <div class="section-sep"></div>
          <div class="section-title"><span class="mini-bars"><i></i><i></i><i></i></span>元素</div>
          <div class="action-grid"><button id="duplicateBtn">复制</button><button id="lockBtn">锁定</button><button id="hideBtn">隐藏</button><button id="frontBtn">置顶</button><button id="backBtn">置底</button><button id="deleteBtn" class="danger">删除</button></div>
        </div>
      </section>
      <section id="layersTab" class="right-body hidden">
        <div class="layers-toolbar">
          <input id="layerSearch" placeholder="搜索图层">
          <button id="layerTopBtn" title="置顶">顶</button>
          <button id="layerBottomBtn" title="置底">底</button>
        </div>
        <div class="layers-hint">拖动排序 · 双击名称重命名 · 悬浮定位</div>
        <div id="layerList" class="layer-list"></div>
      </section>
    </aside>
  </main>

  <div id="toast" class="toast" role="status"></div>
  <div id="contextMenu" class="context-menu hidden"><button data-cmd="duplicate">复制</button><button data-cmd="front">置于顶层</button><button data-cmd="back">置于底层</button><button data-cmd="lock">锁定/解锁</button><hr><button data-cmd="delete" class="danger">删除</button></div>
  <script type="module" src="./js/designer.js?v=20261005-22"></script>
<!-- redeploy-trigger: 2026-10-04T16:00+08:00 -->
<!-- redeploy-trigger: 2026-10-05T12:00+08:00 -->
</body>
</html>
